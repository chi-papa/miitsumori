<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #5c7a5c;
            --primary-hover: #4a6449;
            --bg-app: #f5f0e8;
            --bg-card: #fdfaf3;
            --border: #d8cdb8;
            --text-main: #2d2820;
            --text-sub: #7a6e60;
            --radius: 8px;
            --shadow: 0 1px 3px 0 rgba(80, 60, 20, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: var(--bg-app);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* グリッドレイアウトの基本構造 */
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid-main { grid-template-columns: 1fr; } }

        .sec { 
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .st { 
            font-size: 13px; font-weight: 700; color: var(--primary);
            margin-bottom: 16px; border-left: 4px solid var(--primary);
            padding-left: 12px; display: flex; align-items: center; justify-content: space-between;
        }

        /* フォーム要素 */
        .f-group { margin-bottom: 12px; }
        .f-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; }
        input, select, textarea {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 14px; color: var(--text-main);
            background: #fefcf5;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(92, 122, 92, 0.12);
        }

        /* 管理番号バー */
        .nbar {
            display: flex; gap: 8px; align-items: center; background: #3d3428;
            padding: 12px 20px; border-radius: var(--radius); color: white; margin-bottom: 24px;
        }
        .nbar input { background: rgba(255,255,255,0.1); border: none; color: white; text-align: center; padding: 6px; }
        .nprev { font-family: monospace; background: #1a1410; padding: 4px 12px; border-radius: 4px; color: #c8a96e; font-weight: bold; }

        /* 保存済みチップ */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .chip { 
            background: #fdfaf3; border: 1px solid var(--border); padding: 6px 12px;
            border-radius: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .chip:hover { border-color: var(--primary); }

        /* テーブルスタイル */
        .etbl { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .etbl th { font-size: 12px; color: var(--text-sub); text-align: left; padding: 8px; border-bottom: 2px solid var(--border); }
        .etbl td { padding: 8px 4px; }
        .etbl input { padding: 8px; }

        /* ボタン */
        .btn { 
            cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 13px; 
            padding: 10px 20px; border: 1px solid var(--border); background: #fdfaf3; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-add { color: var(--primary); border: 1px dashed var(--primary); width: 100%; margin-top: 8px; }
        .btn-add:hover { background: rgba(92, 122, 92, 0.07); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { 
            flex: 1; padding: 12px; text-align: center; background: #e8e0d0; 
            border-radius: var(--radius); cursor: pointer; font-weight: 700; color: var(--text-sub);
        }
        .tab.active { background: var(--primary); color: white; }

        /* Toast & Preview */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 10000; }
        .toast.show { opacity: 1; bottom: 40px; }

        /* A4 Preview Override (Visual Only) */
        #a4 { background:#fff; width:100%; max-width:800px; margin:0 auto; padding:40px; border:1px solid #ddd; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* 既存のA4用スタイルを保持 */
        .h-wrap{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:12px;border-bottom:3px solid #111}
        .h-title{font-size:24px;font-weight:700;letter-spacing:.4em}
        .h-right{text-align:right;font-size:12px;line-height:1.8}
        .h-no{font-size:14px;font-weight:700}
        .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
        .col-box{border:1px solid #bbb;padding:12px}
        .col-lbl{font-size:11px;color:#888;font-weight:700;border-bottom:1px solid #ddd;margin-bottom:8px}
        .to-name{font-size:16px;font-weight:700;margin-bottom:8px}
        .itbl{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:13px}
        .itbl th{background:#f1f5f9;border:1px solid #bbb;padding:8px;font-size:12px}
        .itbl td{border:1px solid #bbb;padding:8px;height:28px}
        .stbl{width:100%;border-collapse:collapse;margin-left:auto;width:40%;font-size:13px}
        .stbl td{padding:8px;border:1px solid #bbb}
        .grand{background:#f1f5f9;font-weight:700}
        /* 保存リスト モーダル */
        #doc-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 9000;
            align-items: center; justify-content: center;
        }
        #doc-modal-overlay.open { display: flex; }
        #doc-modal {
            background: var(--bg-card); border-radius: 12px;
            width: 92%; max-width: 600px; max-height: 80vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        #doc-modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            background: #2d2820; color: white;
        }
        #doc-modal-head h2 { font-size: 14px; font-weight: 700; }
        #doc-modal-close {
            background: none; border: none; color: white;
            font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px;
        }
        #doc-modal-body { overflow-y: auto; padding: 12px 16px 16px; flex: 1; }
        .dlist-section-label {
            font-size: 10px; font-weight: 700; color: var(--text-sub);
            letter-spacing: .08em; padding: 8px 4px 4px; border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .dlist-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 10px; border-radius: 8px; cursor: pointer;
            font-size: 13px; transition: background 0.15s; border-bottom: 1px solid #f0ebe0;
        }
        .dlist-row:hover { background: #f5f0e8; }
        .dlist-no { font-family: monospace; color: var(--primary); font-weight: 700; min-width: 0; flex-shrink: 0; }
        .dlist-name { flex: 1; color: var(--text-main); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dlist-date { color: var(--text-sub); font-size: 11px; white-space: nowrap; }
        .dlist-del { color: #ccc; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 14px; flex-shrink: 0; }
        .dlist-del:hover { color: #ef4444; background: #fee2e2; }
        .dlist-empty { text-align: center; color: var(--text-sub); font-size: 13px; padding: 40px 0; }
        @media print { #doc-modal-overlay { display: none !important; } }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- 保存リスト モーダル -->
<div id="doc-modal-overlay" onclick="if(event.target===this)closeDocModal()">
    <div id="doc-modal">
        <div id="doc-modal-head">
            <h2>📄 保存済み書類</h2>
            <button id="doc-modal-close" onclick="closeDocModal()">×</button>
        </div>
        <div id="doc-modal-body">
            <div id="doc-list-inner"></div>
        </div>
    </div>
</div>

<div class="container">
    <div class="nbar">
        <div style="font-size:12px; font-weight:700; color:#94a3b8">NO.</div>
        <input id="np" value="T" style="width:50px" oninput="rno()">
        <span>-</span>
        <input id="nm" value="EST" style="width:60px" oninput="rno()">
        <span>-</span>
        <input id="nd" style="width:100px" oninput="rno()">
        <span>-</span>
        <input id="ns" style="width:60px" oninput="rno()">
        <div class="nprev" id="nprev">—</div>
        <button class="btn" onclick="autoSeq()" style="padding:4px 12px; background:transparent; color:white; border-color:rgba(255,255,255,0.3)">連番+</button>
    </div>

    <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:16px">
        <div style="display:flex; gap:8px">
            <button class="btn" onclick="openDocModal()">📄 書類一覧</button>
            <button class="btn btn-primary" onclick="saveDoc()">💾 保存</button>
            <button class="btn" onclick="newDoc()">＋ 新規作成</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" id="te" onclick="sw('edit')">入力編集</div>
        <div class="tab" id="tp" onclick="sw('preview')">A4 プレビュー表示</div>
    </div>

    <div id="pe">

        <div class="grid-main">
            <div class="sec">
                <div class="st">送り先情報</div>
                <div class="f-group">
                    <label>会社名・氏名</label>
                    <div style="display:flex;gap:4px">
                        <input id="tn" placeholder="株式会社サンプル">
                        <select id="ts" style="width:80px">
                            <option value="御中">御中</option>
                            <option value="様">様</option>
                            <option value="">なし</option>
                        </select>
                    </div>
                </div>
                <div class="f-group"><label>住所</label><input id="ta"></div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group"><label>担当者名</label><input id="tc"></div>
                    <div class="f-group"><label>納期</label><input id="noki" placeholder="例：在庫確認後ご連絡／約1週間"></div>
                </div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group"><label>有効期限</label><input id="exp" type="date"></div>
                    <div class="f-group"><label>支払い方法</label><input id="pay" value="ご指定の方法"></div>
                </div>
                <!-- ご購入方法は削除（支払い方法で代用） -->
                <input type="hidden" id="sr"><input type="hidden" id="sy"><input type="hidden" id="so"><input type="hidden" id="sot">
            </div>

            <div class="sec">
                <div class="st">発行者情報（自社）</div>
                <div class="f-group">
                    <label>書類種別</label>
                    <select id="doctype" onchange="onDoctype()" style="font-size:16px; font-weight:700; color:var(--primary)">
                        <option value="見積書">📋 見積書</option>
                        <option value="請求書">💴 請求書</option>
                        <option value="領収書">🧾 領収書</option>
                        <option value="納品書">📦 納品書</option>
                    </select>
                </div>
                <div class="f-group"><label>発行日</label><input id="edate" type="date"></div>
                <div class="f-group"><label>会社名・屋号</label><input id="fn"></div>
                <div class="f-group"><label>住所</label><input id="fa"></div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group"><label>電話番号</label><input id="ft"></div>
                    <div class="f-group"><label>担当者名</label><input id="fc"></div>
                </div>
                <div class="f-group"><label>インボイス登録番号</label><input id="inv" placeholder="T1234567890123"></div>
                <button class="btn" style="width:100%; margin-top:8px; font-size:12px" onclick="saveIssuer()">💾 発行者情報を保存する</button>
                
                <div class="st" style="margin-top:20px">税設定</div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group">
                        <label>税区分</label>
                        <select id="tt" onchange="onTax()">
                            <option value="included">税込</option>
                            <option value="excluded">税抜（別途消費税）</option>
                            <option value="exempt">非課税</option>
                        </select>
                    </div>
                    <div class="f-group"><label>税率（%）</label><input type="number" id="tr" value="10"></div>
                </div>
            </div>
        </div>

        <div class="sec">
            <div class="st" id="meisai-title">見積明細</div>
            <table class="etbl">
                <thead>
                    <tr>
                        <th style="width:45%">品名・項目</th>
                        <th style="width:12%">数量</th>
                        <th style="width:18%">単価（円）</th>
                        <th style="width:20%; text-align:right" id="pch">金額</th>
                        <th style="width:5%"></th>
                    </tr>
                </thead>
                <tbody id="ib"></tbody>
            </table>
            <button class="btn btn-add" onclick="addI()">＋ 行を追加する</button>
        </div>

        <div class="sec">
            <div class="st">備考・注記
                <div style="display:flex; gap:6px">
                    <button class="btn" style="padding:4px 8px; font-size:10px" onclick="itax()">税込注記挿入</button>
                    <button class="btn" style="padding:4px 8px; font-size:10px" onclick="ins('振込先：〇〇銀行')">振込先挿入</button>
                </div>
            </div>
            <textarea id="notes" rows="4" placeholder="お支払い条件や注意事項を入力してください"></textarea>
            
            <div class="st" style="margin-top:20px">自由項目（追加条件）</div>
            <table class="etbl">
                <tbody id="cb"></tbody>
            </table>
            <button class="btn btn-add" onclick="addC()">＋ 自由項目を追加</button>
        </div>

        <div style="display:flex; justify-content:center; padding:40px 0">
            <button class="btn btn-primary" style="font-size:18px; padding:16px 60px" onclick="sw('preview')">プレビューを確認する</button>
        </div>
    </div>

    <div id="pp" style="display:none">
        <div id="a4"></div>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:30px">
            <button class="btn" onclick="sw('edit')">編集に戻る</button>
            <button class="btn btn-primary" onclick="printWithName()">印刷 / PDF保存</button>
        </div>
    </div>
</div>

<script>
const SK='est_v12';
let items=[],conds=[],ni=1,nc=1;

function g(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Math.round(n).toLocaleString('ja-JP');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

function docno(){return[g('np'),g('nm'),g('nd'),g('ns')].filter(Boolean).join('-');}
function rno(){document.getElementById('nprev').textContent=docno()||'—';}

function getDocs(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch{return {};}}
function saveDocs(d){localStorage.setItem(SK,JSON.stringify(d));}

function autoSeq(){
  const docs=getDocs(),keys=Object.keys(docs);
  const pfx=[g('np'),g('nm'),g('nd')].filter(Boolean).join('-')+'-';
  let max=0;
  keys.forEach(k=>{if(k.startsWith(pfx)){const n=parseInt(k.slice(pfx.length))||0;if(n>max)max=n;}});
  document.getElementById('ns').value=String(max+1).padStart(3,'0');
  rno();
}

function addC(l='',v=''){conds.push({id:nc++,label:l,value:v});renderC();}
function removeC(id){conds=conds.filter(c=>c.id!==id);renderC();}
function setC(id,k,v){const c=conds.find(c=>c.id===id);if(c)c[k]=v;}
function renderC(){
  document.getElementById('cb').innerHTML=conds.map(c=>`
    <tr>
      <td style="width:30%"><input value="${esc(c.label)}" placeholder="項目名（例：工事場所）" oninput="setC(${c.id},'label',this.value)"></td>
      <td><input value="${esc(c.value)}" placeholder="内容" oninput="setC(${c.id},'value',this.value)"></td>
      <td style="width:40px"><button style="color:red;border:none;background:none;cursor:pointer" onclick="removeC(${c.id})">×</button></td>
    </tr>`).join('');
}

function addI(name='',qty=1,price=0){items.push({id:ni++,name,qty,price});renderI();}
function removeI(id){items=items.filter(i=>i.id!==id);renderI();}
function setI(id,k,v){const it=items.find(i=>i.id===id);if(it){it[k]=v;refAmt();}}
function refAmt(){
  document.querySelectorAll('#ib tr').forEach((tr,i)=>{
    if(items[i])tr.querySelector('.ac').textContent='¥'+fmt(items[i].qty*items[i].price);
  });
}
function renderI(){
  document.getElementById('ib').innerHTML=items.map(it=>`
    <tr>
      <td><input value="${esc(it.name)}" placeholder="商品名・サービス内容" oninput="setI(${it.id},'name',this.value)"></td>
      <td><input type="number" min="0" value="${it.qty}" style="text-align:right" oninput="setI(${it.id},'qty',+this.value)"></td>
      <td><input type="number" min="0" value="${it.price}" style="text-align:right" oninput="setI(${it.id},'price',+this.value)"></td>
      <td class="ac" style="text-align:right; font-weight:700">¥${fmt(it.qty*it.price)}</td>
      <td><button style="color:red;border:none;background:none;cursor:pointer" onclick="removeI(${it.id})">×</button></td>
    </tr>`).join('');
}

function taxtype(){return document.getElementById('tt').value;}
function taxrate(){return parseFloat(g('tr'))||0;}
function onTax(){
  const t=taxtype(),h=document.getElementById('pch');
  if(h)h.textContent=t==='included'?'金額（税込）':t==='excluded'?'金額（税抜）':'金額';
}

function ins(text){const ta=document.getElementById('notes');ta.value=(ta.value?ta.value.trimEnd()+'\n\n':'')+text;}
function itax(){
  const total=items.reduce((s,it)=>s+it.qty*it.price,0);
  const rate=taxrate(),ta=Math.round(total*(rate/(100+rate)));
  ins(`※ 金額はすべて税込表示です（税率${rate}%、消費税 ¥${fmt(ta)} 含む）`);
}

function shops(){
  const s=[];
  if(document.getElementById('sr').checked)s.push('楽天ショップ');
  if(document.getElementById('sy').checked)s.push('Yahoo!ショッピング');
  if(document.getElementById('so').checked)s.push(g('sot')||'その他');
  return s.join('・');
}

function calcT(){
  const total=items.reduce((s,it)=>s+it.qty*it.price,0);
  const type=taxtype(),rate=taxrate();
  if(type==='included')return{total,taxAmt:Math.round(total*(rate/(100+rate))),type,rate};
  if(type==='excluded'){const tax=Math.round(total*rate/100);return{total,taxAmt:tax,grand:total+tax,type,rate};}
  return{total,type,rate};
}

function collect(){
  return{
    np:g('np'),nm:g('nm'),nd:g('nd'),ns:g('ns'),
    doctype:document.getElementById('doctype').value,
    fn:g('fn'),fa:g('fa'),ft:g('ft'),fc:g('fc'),inv:g('inv'),
    tn:g('tn'),ts:document.getElementById('ts').value,

            border-radius: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .chip:hover { border-color: var(--primary); }

        /* テーブルスタイル */
        .etbl { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .etbl th { font-size: 12px; color: var(--text-sub); text-align: left; padding: 8px; border-bottom: 2px solid var(--border); }
        .etbl td { padding: 8px 4px; }
        .etbl input { padding: 8px; }

        /* ボタン */
        .btn { 
            cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 13px; 
            padding: 10px 20px; border: 1px solid var(--border); background: #fdfaf3; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-add { color: var(--primary); border: 1px dashed var(--primary); width: 100%; margin-top: 8px; }
        .btn-add:hover { background: rgba(92, 122, 92, 0.07); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { 
            flex: 1; padding: 12px; text-align: center; background: #e8e0d0; 
            border-radius: var(--radius); cursor: pointer; font-weight: 700; color: var(--text-sub);
        }
        .tab.active { background: var(--primary); color: white; }

        /* Toast & Preview */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 10000; }
        .toast.show { opacity: 1; bottom: 40px; }

        /* A4 Preview Override (Visual Only) */
        #a4 { background:#fff; width:210mm; min-height:297mm; margin:0 auto; padding:14mm 16mm; border:1px solid #ddd; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        /* A4 2枚目ページ区切り */
        .page-break { border-top: 2px dashed #aaa; margin: 20px 0; padding-top: 16px; position: relative; }
        .page-break::before { content: "--- 2枚目 ---"; position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:#fff; padding:0 8px; font-size:10px; color:#aaa; }
        
        /* 既存のA4用スタイルを保持 */
        .h-wrap{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:10px;border-bottom:3px solid #111}
        .h-title{font-size:22px;font-weight:700;letter-spacing:.4em}
        .h-right{text-align:right;font-size:11px;line-height:1.7}
        .h-no{font-size:13px;font-weight:700}
        .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
        .col-box{border:1px solid #bbb;padding:10px}
        .col-lbl{font-size:10px;color:#888;font-weight:700;border-bottom:1px solid #ddd;margin-bottom:6px}
        .to-name{font-size:15px;font-weight:700;margin-bottom:6px}
        .itbl{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12px}
        .itbl th{background:#f1f5f9;border:1px solid #bbb;padding:5px 7px;font-size:11px}
        .itbl td{border:1px solid #bbb;padding:4px 7px;height:22px}
        .stbl{border-collapse:collapse;margin-left:auto;width:44%;font-size:12px}
        .stbl td{padding:6px 8px;border:1px solid #bbb}
        .grand{background:#f1f5f9;font-weight:700}

        /* 印刷専用スタイル */
        @media print {
            /* 編集UI・操作ボタン等はすべて非表示 */
            .nbar, .chips, .tabs, #pe, #toast,
            .no-print { display: none !important; }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .container { max-width: none; }

            /* プレビューエリアのみ表示 */
            #pp { display: block !important; }

            #a4 {
                width: 210mm;
                min-height: auto;
                max-width: none;
                margin: 0;
                padding: 14mm 16mm;
                border: none !important;
                box-shadow: none !important;
                page-break-after: avoid;
            }

            /* 2枚モード時のページ区切り */
            .page-break {
                border: none !important;
                page-break-before: always;
                margin: 0;
                padding: 0;
            }
            .page-break::before { display: none; }

            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <div class="nbar">
        <div style="font-size:12px; font-weight:700; color:#94a3b8">NO.</div>
        <input id="np" value="T" style="width:50px" oninput="rno()">
        <span>-</span>
        <input id="nm" value="EST" style="width:60px" oninput="rno()">
        <span>-</span>
        <input id="nd" style="width:100px" oninput="rno()">
        <span>-</span>
        <input id="ns" style="width:60px" oninput="rno()">
        <div class="nprev" id="nprev">—</div>
        <button class="btn" onclick="autoSeq()" style="padding:4px 12px; background:transparent; color:white; border-color:rgba(255,255,255,0.3)">連番+</button>
    </div>

    <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
        <div id="chips" class="chips"></div>
        <div style="display:flex; gap:8px">
            <button class="btn btn-primary" onclick="saveDoc()">💾 保存</button>
            <button class="btn" onclick="newDoc()">＋ 新規作成</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" id="te" onclick="sw('edit')">入力編集</div>
        <div class="tab" id="tp" onclick="sw('preview')">A4 プレビュー表示</div>
    </div>

    <div id="pe">
        <div class="grid-main">
            <div class="sec">
                <div class="st">送り先情報</div>
                <div class="f-group">
                    <label>会社名・氏名</label>
                    <div style="display:flex;gap:4px">
                        <input id="tn" placeholder="株式会社サンプル">
                        <select id="ts" style="width:80px">
                            <option value="御中">御中</option>
                            <option value="様">様</option>
                            <option value="">なし</option>
                        </select>
                    </div>
                </div>
                <div class="f-group"><label>住所</label><input id="ta"></div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group"><label>担当者名</label><input id="tc"></div>
                    <div class="f-group"><label>納期 / 納品日</label><input id="noki" placeholder="例：2026年6月30日 / 即日 / 応相談"></div>
                </div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group"><label>有効期限</label><input id="exp" type="date"></div>
                    <div class="f-group"><label>支払い方法</label><input id="pay" value="ご指定の方法"></div>
                </div>
                <!-- ご購入方法は削除（支払い方法で代用） -->
                <input type="hidden" id="sr"><input type="hidden" id="sy"><input type="hidden" id="so"><input type="hidden" id="sot">
            </div>

            <div class="sec">
                <div class="st">発行者情報（自社）
                    <div style="display:flex;gap:6px;align-items:center">
                        <span id="issuer-badge" style="display:none;font-size:10px;background:#d4edda;color:#276336;padding:2px 8px;border-radius:10px;font-weight:600">✓ 登録済み</span>
                        <button class="btn" style="padding:3px 10px;font-size:11px" onclick="saveIssuer()">自社情報を登録</button>
                    </div>
                </div>
                <div class="f-group">
                    <label>書類種別</label>
                    <select id="doctype" onchange="onDoctype()" style="font-size:16px; font-weight:700; color:var(--primary)">
                        <option value="見積書">📋 見積書</option>
                        <option value="請求書">💴 請求書</option>
                        <option value="領収書">🧾 領収書</option>
                        <option value="納品書">📦 納品書</option>
                    </select>
                </div>
                <div class="f-group"><label>発行日</label><input id="edate" type="date"></div>
                <div class="f-group"><label>会社名・屋号</label><input id="fn"></div>
                <div class="f-group"><label>住所</label><input id="fa"></div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group"><label>電話番号</label><input id="ft"></div>
                    <div class="f-group"><label>担当者名</label><input id="fc"></div>
                </div>
                <div class="f-group"><label>インボイス登録番号</label><input id="inv" placeholder="T1234567890123"></div>
                
                <div class="st" style="margin-top:20px">税設定</div>
                <div class="grid-main" style="gap:10px; margin-bottom:0">
                    <div class="f-group">
                        <label>税区分</label>
                        <select id="tt" onchange="onTax()">
                            <option value="included">税込</option>
                            <option value="excluded">税抜（別途消費税）</option>
                            <option value="exempt">非課税</option>
                        </select>
                    </div>
                    <div class="f-group"><label>税率（%）</label><input type="number" id="tr" value="10"></div>
                </div>
            </div>
        </div>

        <div class="sec">
            <div class="st" id="meisai-title">見積明細</div>
            <table class="etbl">
                <thead>
                    <tr>
                        <th style="width:45%">品名・項目</th>
                        <th style="width:12%">数量</th>
                        <th style="width:18%">単価（円）</th>
                        <th style="width:20%; text-align:right" id="pch">金額</th>
                        <th style="width:5%"></th>
                    </tr>
                </thead>
                <tbody id="ib"></tbody>
            </table>
            <button class="btn btn-add" onclick="addI()">＋ 行を追加する</button>
        </div>

        <div class="sec">
            <div class="st">備考・注記
                <div style="display:flex; gap:6px">
                    <button class="btn" style="padding:4px 8px; font-size:10px" onclick="itax()">税込注記挿入</button>
                    <button class="btn" style="padding:4px 8px; font-size:10px" onclick="ins('振込先：〇〇銀行')">振込先挿入</button>
                </div>
            </div>
            <textarea id="notes" rows="4" placeholder="お支払い条件や注意事項を入力してください"></textarea>
            
            <div class="st" style="margin-top:20px">自由項目（追加条件）</div>
            <table class="etbl">
                <tbody id="cb"></tbody>
            </table>
            <button class="btn btn-add" onclick="addC()">＋ 自由項目を追加</button>
        </div>

        <div style="display:flex; justify-content:center; padding:40px 0">
            <button class="btn btn-primary" style="font-size:18px; padding:16px 60px" onclick="sw('preview')">プレビューを確認する</button>
        </div>
    </div>

    <div id="pp" style="display:none">
        <div class="no-print" style="display:flex; gap:10px; justify-content:center; align-items:center; margin-bottom:16px; flex-wrap:wrap">
            <span style="font-size:12px; color:var(--text-sub); font-weight:700">ページ設定：</span>
            <button class="btn" id="btn1p" onclick="setPageMode(1)" style="padding:6px 16px; font-size:12px; background:var(--primary); color:white; border:none">1枚（A4×1）</button>
            <button class="btn" id="btn2p" onclick="setPageMode(2)" style="padding:6px 16px; font-size:12px;">2枚（A4×2）</button>
            <span id="page-hint" style="font-size:11px; color:var(--text-sub)">現在：1枚モード</span>
        </div>
        <div id="a4"></div>
        <div id="fit-warn" class="no-print" style="display:none; text-align:center; margin-top:12px">
            <span style="background:#fff3cd; border:1px solid #f0c040; border-radius:6px; padding:6px 16px; font-size:12px; color:#856404">
                ⚠️ 内容がA4をはみ出す可能性があります。自動縮小して印刷します。
            </span>
        </div>
        <div class="no-print" style="display:flex; gap:12px; justify-content:center; margin-top:16px">
            <button class="btn" onclick="sw('edit')">編集に戻る</button>
            <button class="btn btn-primary" onclick="smartPrint()">🖨 印刷 / PDF保存</button>
        </div>
    </div>
</div>

<script>
/* ロジック部分はv9の機能を完全に維持し、
   セレクタIDが変更されないよう配慮して実装しています。
*/
const SK='est_v12';
let items=[],conds=[],ni=1,nc=1;

function g(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Math.round(n).toLocaleString('ja-JP');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

function docno(){return[g('np'),g('nm'),g('nd'),g('ns')].filter(Boolean).join('-');}
function rno(){document.getElementById('nprev').textContent=docno()||'—';}

function getDocs(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch{return {};}}
function saveDocs(d){localStorage.setItem(SK,JSON.stringify(d));}

function autoSeq(){
  const docs=getDocs(),keys=Object.keys(docs);
  const pfx=[g('np'),g('nm'),g('nd')].filter(Boolean).join('-')+'-';
  let max=0;
  keys.forEach(k=>{if(k.startsWith(pfx)){const n=parseInt(k.slice(pfx.length))||0;if(n>max)max=n;}});
  document.getElementById('ns').value=String(max+1).padStart(3,'0');
  rno();
}

function addC(l='',v=''){conds.push({id:nc++,label:l,value:v});renderC();}
function removeC(id){conds=conds.filter(c=>c.id!==id);renderC();}
function setC(id,k,v){const c=conds.find(c=>c.id===id);if(c)c[k]=v;}
function renderC(){
  document.getElementById('cb').innerHTML=conds.map(c=>`
    <tr>
      <td style="width:30%"><input value="${esc(c.label)}" placeholder="項目名（例：工事場所）" oninput="setC(${c.id},'label',this.value)"></td>
      <td><input value="${esc(c.value)}" placeholder="内容" oninput="setC(${c.id},'value',this.value)"></td>
      <td style="width:40px"><button style="color:red;border:none;background:none;cursor:pointer" onclick="removeC(${c.id})">×</button></td>
    </tr>`).join('');
}

function addI(name='',qty=1,price=0){items.push({id:ni++,name,qty,price});renderI();}
function removeI(id){items=items.filter(i=>i.id!==id);renderI();}
function setI(id,k,v){const it=items.find(i=>i.id===id);if(it){it[k]=v;refAmt();}}
function refAmt(){
  document.querySelectorAll('#ib tr').forEach((tr,i)=>{
    if(items[i])tr.querySelector('.ac').textContent='¥'+fmt(items[i].qty*items[i].price);
  });
}
function renderI(){
  document.getElementById('ib').innerHTML=items.map(it=>`
    <tr>
      <td><input value="${esc(it.name)}" placeholder="商品名・サービス内容" oninput="setI(${it.id},'name',this.value)"></td>
      <td><input type="number" min="0" value="${it.qty}" style="text-align:right" oninput="setI(${it.id},'qty',+this.value)"></td>
      <td><input type="number" min="0" value="${it.price}" style="text-align:right" oninput="setI(${it.id},'price',+this.value)"></td>
      <td class="ac" style="text-align:right; font-weight:700">¥${fmt(it.qty*it.price)}</td>
      <td><button style="color:red;border:none;background:none;cursor:pointer" onclick="removeI(${it.id})">×</button></td>
    </tr>`).join('');
}

function taxtype(){return document.getElementById('tt').value;}
function taxrate(){return parseFloat(g('tr'))||0;}
function onTax(){
  const t=taxtype(),h=document.getElementById('pch');
  if(h)h.textContent=t==='included'?'金額（税込）':t==='excluded'?'金額（税抜）':'金額';
}

function ins(text){const ta=document.getElementById('notes');ta.value=(ta.value?ta.value.trimEnd()+'\n\n':'')+text;}
function itax(){
  const total=items.reduce((s,it)=>s+it.qty*it.price,0);
  const rate=taxrate(),ta=Math.round(total*(rate/(100+rate)));
  ins(`※ 金額はすべて税込表示です（税率${rate}%、消費税 ¥${fmt(ta)} 含む）`);
}

function shops(){
  const s=[];
  if(document.getElementById('sr').checked)s.push('楽天ショップ');
  if(document.getElementById('sy').checked)s.push('Yahoo!ショッピング');
  if(document.getElementById('so').checked)s.push(g('sot')||'その他');
  return s.join('・');
}

function calcT(){
  const total=items.reduce((s,it)=>s+it.qty*it.price,0);
  const type=taxtype(),rate=taxrate();
  if(type==='included')return{total,taxAmt:Math.round(total*(rate/(100+rate))),type,rate};
  if(type==='excluded'){const tax=Math.round(total*rate/100);return{total,taxAmt:tax,grand:total+tax,type,rate};}
  return{total,type,rate};
}

function collect(){
  return{
    np:g('np'),nm:g('nm'),nd:g('nd'),ns:g('ns'),
    doctype:document.getElementById('doctype').value,
    fn:g('fn'),fa:g('fa'),ft:g('ft'),fc:g('fc'),inv:g('inv'),
    tn:g('tn'),ts:document.getElementById('ts').value,
    ta:g('ta'),tc:g('tc'),exp:g('exp'),pay:g('pay'),noki:g('noki'),
    edate:g('edate'),
    sr:document.getElementById('sr').checked,
    sy:document.getElementById('sy').checked,
    so:document.getElementById('so').checked,
    sot:g('sot'),
    tt:taxtype(),tr:taxrate(),
    conds:conds.map(c=>({label:c.label,value:c.value})),
    items:items.map(it=>({name:it.name,qty:it.qty,price:it.price})),
    notes:g('notes'),
    savedAt:new Date().toLocaleString('ja-JP')
  };
}

function onDoctype(){
  const dt=document.getElementById('doctype').value;
  const label={見積書:'見積明細',請求書:'請求明細',領収書:'内訳明細',納品書:'納品明細'}[dt]||'明細';
  document.getElementById('meisai-title').textContent=label;
}

function applyD(d){
  const sv=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v??'';};
  sv('np',d.np);sv('nm',d.nm);sv('nd',d.nd);sv('ns',d.ns);rno();
  sv('fn',d.fn);sv('fa',d.fa);sv('ft',d.ft);sv('fc',d.fc);sv('inv',d.inv);
  sv('tn',d.tn);sv('ta',d.ta);sv('tc',d.tc);sv('exp',d.exp);sv('pay',d.pay);sv('noki',d.noki);sv('edate',d.edate);
  const ts=document.getElementById('ts');if(ts)ts.value=d.ts||'御中';
  const tt=document.getElementById('tt');if(tt)tt.value=d.tt||'included';
  const dt=document.getElementById('doctype');if(dt)dt.value=d.doctype||'見積書';
  onDoctype();
  sv('tr',d.tr??10);sv('sot',d.sot);sv('notes',d.notes);
  document.getElementById('sr').checked=!!d.sr;
  document.getElementById('sy').checked=!!d.sy;
  document.getElementById('so').checked=!!d.so;
  conds=[];nc=1;(d.conds||[]).forEach(c=>addC(c.label,c.value));
  items=[];ni=1;(d.items||[]).forEach(it=>addI(it.name,it.qty,it.price));
  onTax();
  // 発行元バッジ更新
  const raw = localStorage.getItem(ISSUER_KEY);
  if (raw) {
    try {
      const saved = JSON.parse(raw);
      const match = ['fn','fa','ft','fc','inv'].every(k => (d[k]||'') === (saved[k]||''));
      showIssuerBadge(match);
    } catch(e) { showIssuerBadge(false); }
  }
}

function saveDoc(){
  const no=docno();if(!no){toast('管理番号を入力してください');return;}
  const docs=getDocs();docs[no]=collect();saveDocs(docs);renderChips();
  toast(`「${no}」を保存しました`);
}

function loadDoc(no){const d=getDocs()[no];if(d){applyD(d);toast(`「${no}」を読み込みました`);}}
function deleteDoc(no){
  if(!confirm(`「${no}」を削除しますか？`))return;
  const docs=getDocs();delete docs[no];saveDocs(docs);renderChips();
  toast(`「${no}」を削除しました`);
}

function newDoc(){
  if(!confirm('現在の内容をクリアして新規作成しますか？'))return;
  items=[];conds=[];ni=1;nc=1;
  // 送り先・備考のみクリア（発行元はloadIssuerで復元）
  ['tn','ta','tc','sot','notes','noki'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  // 発行元もいったんクリア（loadIssuerで復元される）
  ['fn','fa','ft','fc','inv'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('pay').value='ご指定の方法';
  document.getElementById('tr').value='10';
  document.getElementById('tt').value='included';
  document.getElementById('ts').value='御中';
  ['sr','sy','so'].forEach(id=>document.getElementById(id).checked=false);
  const today=new Date(),fd=d=>d.toISOString().split('T')[0];
  const exp=new Date(today);exp.setDate(exp.getDate()+30);
  document.getElementById('edate').value=fd(today);
  document.getElementById('exp').value=fd(exp);
  document.getElementById('nd').value=fd(today).replace(/-/g,'');
  addI('商品A',1,0);addI('商品B',1,0);addI('送料',1,0);
  onTax();autoSeq();loadIssuer();toast('新規作成しました');
}

function renderChips(){
  const docs=getDocs(),keys=Object.keys(docs).sort().reverse();
  const el=document.getElementById('chips');
  if(!keys.length){el.innerHTML='<span style="font-size:11px;color:var(--text-sub)">保存済みなし</span>';return;}
  el.innerHTML=keys.map(k=>`
    <div class="chip" onclick="loadDoc('${esc(k)}')" title="${esc(docs[k].savedAt||'')}">
      📄 ${esc(k)}
      <span style="color:#94a3b8" onclick="event.stopPropagation();deleteDoc('${esc(k)}')">×</span>
    </div>`).join('');
}

let pageMode = 1; // 1 or 2

// A4高さ（mm→px換算：1mm≒3.7795px、印刷96dpiベース）
const A4_H_PX = 297 * 3.7795;

function checkFit() {
  if (pageMode === 2) {
    document.getElementById('fit-warn').style.display = 'none';
    return;
  }
  const a4 = document.getElementById('a4');
  const warn = document.getElementById('fit-warn');
  // scrollHeightで実際のコンテンツ高さを取得
  const h = a4.scrollHeight;
  warn.style.display = h > A4_H_PX ? 'block' : 'none';
}

function smartPrint() {
  // 必ずプレビュー画面に切り替えてから印刷
  sw('preview');

  // レンダリング完了を待ってから印刷
  requestAnimationFrame(() => {
    const a4 = document.getElementById('a4');
    let prevTransform = a4.style.transform;
    let prevTransformOrigin = a4.style.transformOrigin;

    if (pageMode !== 2) {
      const contentH = a4.scrollHeight;
      if (contentH > A4_H_PX * 1.01) {
        const scale = Math.min(1, A4_H_PX / contentH);
        a4.style.transformOrigin = 'top center';
        a4.style.transform = `scale(${scale})`;
      }
    }

    window.print();

    setTimeout(() => {
      a4.style.transform = prevTransform;
      a4.style.transformOrigin = prevTransformOrigin;
    }, 1000);
  });
}

function setPageMode(n) {
  pageMode = n;
  document.getElementById('btn1p').style.background = n===1 ? 'var(--primary)' : '';
  document.getElementById('btn1p').style.color = n===1 ? 'white' : '';
  document.getElementById('btn1p').style.border = n===1 ? 'none' : '';
  document.getElementById('btn2p').style.background = n===2 ? 'var(--primary)' : '';
  document.getElementById('btn2p').style.color = n===2 ? 'white' : '';
  document.getElementById('btn2p').style.border = n===2 ? 'none' : '';
  document.getElementById('page-hint').textContent = `現在：${n}枚モード`;
  buildPreview();
}

function buildPreview(){
  const {total,taxAmt,grand,type,rate}=calcT();
  const suffix=document.getElementById('ts').value;
  const toFull=(g('tn')+(suffix?' '+suffix:'')).trim()||'　';
  const pl=type==='included'?'（税込）':type==='excluded'?'（税抜）':'';
  const doctype=document.getElementById('doctype').value;
  const isEstimate=(doctype==='見積書');
  const isDelivery=(doctype==='納品書');

  function drow(lbl,val){
    if(!val)return'';
    return`<div style="display:flex; border-bottom:1px solid #eee; margin-bottom:3px; font-size:11px">
            <span style="width:60px; color:#666; flex-shrink:0">${lbl}</span>
            <span style="flex:1">${esc(val)}</span>
           </div>`;
  }

  // 明細行（空行はモードに応じて）
  const filledRows=items.map((it,i)=>`
    <tr>
      <td style="text-align:center">${i+1}</td>
      <td>${esc(it.name)}</td>
      <td style="text-align:right">${fmt(it.qty)}</td>
      <td style="text-align:right">¥${fmt(it.price)}</td>
      <td style="text-align:right">¥${fmt(it.qty*it.price)}</td>
    </tr>`).join('');

  // 1枚モード：空行は最小限（合計5行未満なら5行に揃える程度）
  // 2枚モード：1枚目に収まる行数 + 2枚目に溢れる行
  const minRows = pageMode === 2 ? 20 : Math.max(0, 5 - items.length);
  const emptyCount = Math.max(0, minRows - items.length);
  const emptyRows=Array.from({length:emptyCount},(_,i)=>`
    <tr><td style="text-align:center">${items.length+i+1}</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>`).join('');

  let totalRows='';
  if(type==='included'){
    totalRows+=`<tr class="grand"><td>合計金額（税込）</td><td style="text-align:right">¥${fmt(total)}</td></tr>`;
    totalRows+=`<tr style="font-size:10px"><td>うち消費税（${rate}%）</td><td style="text-align:right">¥${fmt(taxAmt)}</td></tr>`;
  }else if(type==='excluded'){
    totalRows+=`<tr><td>小計（税抜）</td><td style="text-align:right">¥${fmt(total)}</td></tr>`;
    totalRows+=`<tr><td>消費税（${rate}%）</td><td style="text-align:right">¥${fmt(taxAmt)}</td></tr>`;
    totalRows+=`<tr class="grand"><td>合計金額（税込）</td><td style="text-align:right">¥${fmt(grand)}</td></tr>`;
  }else{
    totalRows+=`<tr class="grand"><td>合計金額（非課税）</td><td style="text-align:right">¥${fmt(total)}</td></tr>`;
  }

  const condRows=conds.filter(c=>c.label).map(c=>`<tr><td style="background:#f1f5f9; font-weight:700; width:30%">${esc(c.label)}</td><td>${esc(c.value)}</td></tr>`).join('');

  // ヘッダー＋宛先部分（共通パーツ）
  function buildHeader() {
    return `
    <div class="h-wrap">
      <div class="h-title">${esc(document.getElementById('doctype').value).split('').join('　')}</div>
      <div class="h-right">
        <div class="h-no">${esc(docno())||'—'}</div>
        <div>発行日：${esc(g('edate'))||'　'}</div>
      </div>
    </div>
    <div class="cols">
      <div class="col-box">
        <div class="col-lbl">宛先</div>
        <div class="to-name">${esc(toFull)}</div>
        ${drow('住所', g('ta'))}
        ${drow('担当者', g('tc'))}
        ${isEstimate?drow('有効期限', g('exp')):''}
        ${isEstimate?drow('支払方法', g('pay')):''}
        ${(isEstimate||isDelivery)?drow(isDelivery?'納品日':'納期', g('noki')):''}
      </div>
      <div class="col-box">
        <div class="col-lbl">発行元</div>
        <div class="from-name" style="font-size:14px;font-weight:700;margin-bottom:6px">${esc(g('fn'))||'　'}</div>
        ${drow('住所', g('fa'))}
        ${drow('TEL', g('ft'))}
        ${drow('担当', g('fc'))}
        ${drow('登録番号', g('inv'))}
      </div>
    </div>`;
  }

  // 2枚モード：1枚目＝ヘッダー+条件+明細上半分、2枚目＝明細下半分+合計+備考
  // 1枚モード：すべて1枚
  let html = '';
  if (pageMode === 2) {
    const splitAt = Math.ceil(items.length / 2);
    const items1 = items.slice(0, splitAt);
    const items2 = items.slice(splitAt);

    const rows1 = items1.map((it,i)=>`
      <tr>
        <td style="text-align:center">${i+1}</td>
        <td>${esc(it.name)}</td>
        <td style="text-align:right">${fmt(it.qty)}</td>
        <td style="text-align:right">¥${fmt(it.price)}</td>
        <td style="text-align:right">¥${fmt(it.qty*it.price)}</td>
      </tr>`).join('');

    const rows2 = items2.map((it,i)=>`
      <tr>
        <td style="text-align:center">${splitAt+i+1}</td>
        <td>${esc(it.name)}</td>
        <td style="text-align:right">${fmt(it.qty)}</td>
        <td style="text-align:right">¥${fmt(it.price)}</td>
        <td style="text-align:right">¥${fmt(it.qty*it.price)}</td>
      </tr>`).join('');

    html = `
      ${buildHeader()}
      ${condRows?`<table class="itbl" style="margin-bottom:10px">${condRows}</table>`:''}
      <table class="itbl">
        <thead><tr>
          <th style="width:36px">No.</th>
          <th>品名・備考</th>
          <th style="width:55px">数量</th>
          <th style="width:90px">単価</th>
          <th style="width:110px">金額${pl}</th>
        </tr></thead>
        <tbody>${rows1}</tbody>
      </table>
      <div style="text-align:right; font-size:10px; color:#aaa; margin-top:4px">（次ページへ続く）</div>

      <div class="page-break">
        ${buildHeader()}
        <table class="itbl">
          <thead><tr>
            <th style="width:36px">No.</th>
            <th>品名・備考</th>
            <th style="width:55px">数量</th>
            <th style="width:90px">単価</th>
            <th style="width:110px">金額${pl}</th>
          </tr></thead>
          <tbody>${rows2||'<tr><td colspan="5" style="text-align:center; color:#aaa; font-size:11px">（続き）</td></tr>'}</tbody>
        </table>
        ${isDelivery
          ? `<div style="text-align:right; font-size:13px; margin:8px 0 4px; font-weight:700">　　以　上</div>`
          : `<table class="stbl">${totalRows}</table>`
        }
        ${g('notes')?`<div style="margin-top:16px"><div class="col-lbl">備考</div><div style="border:1px solid #bbb; padding:8px; font-size:11px; white-space:pre-wrap">${esc(g('notes'))}</div></div>`:''}
      </div>`;
  } else {
    html = `
      ${buildHeader()}
      ${condRows?`<table class="itbl" style="margin-bottom:10px">${condRows}</table>`:''}
      <table class="itbl">
        <thead><tr>
          <th style="width:36px">No.</th>
          <th>品名・備考</th>
          <th style="width:55px">数量</th>
          <th style="width:90px">単価</th>
          <th style="width:110px">金額${pl}</th>
        </tr></thead>
        <tbody>${filledRows}${emptyRows}</tbody>
      </table>
      ${isDelivery
        ? `<div style="text-align:right; font-size:13px; margin:8px 0 4px; font-weight:700">　　以　上</div>`
        : `<table class="stbl">${totalRows}</table>`
      }
      ${g('notes')?`<div style="margin-top:16px"><div class="col-lbl">備考</div><div style="border:1px solid #bbb; padding:8px; font-size:11px; white-space:pre-wrap">${esc(g('notes'))}</div></div>`:''}`;
  }

  document.getElementById('a4').innerHTML = html;
  // レンダリング後にフィットチェック
  requestAnimationFrame(checkFit);
}

function sw(tab){
  document.getElementById('te').classList.toggle('active',tab==='edit');
  document.getElementById('tp').classList.toggle('active',tab==='preview');
  document.getElementById('pe').style.display=tab==='edit'?'block':'none';
  document.getElementById('pp').style.display=tab==='preview'?'block':'none';
  if(tab==='preview')buildPreview();
}

/* ===== 発行元（自社情報）永続化 ===== */
const ISSUER_KEY = 'est_issuer';

function saveIssuer() {
  const d = { fn:g('fn'), fa:g('fa'), ft:g('ft'), fc:g('fc'), inv:g('inv') };
  if (!d.fn) { toast('会社名・屋号を入力してください'); return; }
  localStorage.setItem(ISSUER_KEY, JSON.stringify(d));
  showIssuerBadge(true);
  toast('自社情報を登録しました');
}

function loadIssuer() {
  const raw = localStorage.getItem(ISSUER_KEY);
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    const sv = (id, v) => { const e = document.getElementById(id); if (e && !e.value) e.value = v || ''; };
    sv('fn', d.fn); sv('fa', d.fa); sv('ft', d.ft); sv('fc', d.fc); sv('inv', d.inv);
    showIssuerBadge(true);
  } catch(e) {}
}

function showIssuerBadge(show) {
  const b = document.getElementById('issuer-badge');
  if (b) b.style.display = show ? 'inline' : 'none';
}

/* 発行元フィールドが編集されたら登録済みバッジを更新 */
['fn','fa','ft','fc','inv'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', () => {
    const raw = localStorage.getItem(ISSUER_KEY);
    if (!raw) return;
    try {
      const d = JSON.parse(raw);
      const changed = ['fn','fa','ft','fc','inv'].some(k => g(k) !== (d[k]||''));
      showIssuerBadge(!changed);
    } catch(e) {}
  });
});
